<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to imacto.com</title>
  <link rel="canonical" href="https://imacto.com/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://imacto.com/">
  <script>
    // path- and query-preserving redirect to the canonical home
    location.replace("https://imacto.com" + location.pathname + location.search + location.hash);
  </script>
</head>
<body>Redirecting to <a href="https://imacto.com/">imacto.com</a>…</body>
</html>
